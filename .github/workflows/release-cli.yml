name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    env:
      PUBLISH_DIR: publish
      ZIP_NAME: CodexBar.Cli-win-x64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore CodexBar.sln

      - name: Publish CLI executable
        run: >-
          dotnet publish CodexBar.Cli/CodexBar.Cli.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o ${{ env.PUBLISH_DIR }}

      - name: Resolve executable path
        id: resolve_exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "${{ env.PUBLISH_DIR }}" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No .exe was produced in ${{ env.PUBLISH_DIR }}"
            exit 1
          }
          "exe_path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "exe_name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Resolved executable: $($exe.FullName)"

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ env.PUBLISH_DIR }}/*" -DestinationPath "${{ env.ZIP_NAME }}" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexBar.Cli-win-x64
          path: |
            ${{ steps.resolve_exe.outputs.exe_path }}
            ${{ env.ZIP_NAME }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.resolve_exe.outputs.exe_path }}
            ${{ env.ZIP_NAME }}
          generate_release_notes: true
          fail_on_unmatched_files: true
